name: nails_by_vril
description: "A Web-Based Online Appointment and Client Management System for Nails By Vril"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Firebase Core & Backend Services
  firebase_core: ^3.1.0
  cloud_firestore: ^5.0.1
  firebase_auth: ^5.1.0

  # State Management & Architecture
  provider: ^6.1.2

  # Design, Typography & Icons
  google_fonts: ^6.2.1
  table_calendar: ^3.1.2
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
